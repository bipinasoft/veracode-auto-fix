# CI for the Veracode Auto-Fix tool itself: test the code and publish the runner image.
# Repositories that want auto-fix include templates/veracode-autofix.gitlab-ci.yml instead.

stages: [test, build]

unit_tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --quiet pytest
    - python -m pytest -q
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build_image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --build-arg BUILD_PACKAGES="${BUILD_PACKAGES:-openjdk-17-jdk-headless maven}" -t "$IMAGE" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$IMAGE"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
